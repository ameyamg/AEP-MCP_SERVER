name: Mirror to Deloitte Org

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + all refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DELOITTE_SSH_KEY }}" > ~/.ssh/id_deloitte
          chmod 600 ~/.ssh/id_deloitte
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "Host github-work
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_deloitte
            IdentitiesOnly yes" >> ~/.ssh/config

      - name: Push mirror to Deloitte org
        run: |
          git push git@github-work:Deloitte-US-Consulting/AEP_MCP_SERVER.git --mirror
