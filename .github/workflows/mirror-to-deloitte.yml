name: Mirror to Deloitte Org

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + all refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Deloitte org
        env:
          PAT: ${{ secrets.DELOITTE_MIRROR_PAT }}
        run: |
          git push "https://x-access-token:${PAT}@github.com/Deloitte-US-Consulting/AEP_MCP_SERVER.git" --mirror
